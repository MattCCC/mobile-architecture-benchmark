pluginManagement {
    def properties = new Properties()
    new File(settingsDir.parentFile, 'flutter/.android/local.properties').withInputStream { properties.load(it) }
    def flutterSdkPath = properties.getProperty('flutter.sdk')
    assert flutterSdkPath != null : 'flutter.sdk not set; run flutter pub get in candidates/island-flutter/flutter'
    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id 'com.android.application' version '9.1.0' apply false
    id 'org.jetbrains.kotlin.android' version '2.4.0' apply false
    id 'org.jetbrains.kotlin.plugin.compose' version '2.4.0' apply false
}

rootProject.name = 'mobilebench-island-flutter-host'
include ':app'

setBinding(new Binding([gradle: this]))
evaluate(new File(settingsDir.parentFile, 'flutter/.android/include_flutter.groovy'))
