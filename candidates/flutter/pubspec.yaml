name: mobilebench_flutter
description: "Flutter candidate of the mobile architecture benchmark."
publish_to: 'none'
version: 0.1.0+1

# Exact pins (benchmark rule): the SDK must be Flutter 3.47.7 / Dart 3.13.5.
environment:
  sdk: 3.13.5
  flutter: 3.47.7

dependencies:
  flutter:
    sdk: flutter
  # SHA-256 for the state and Insights digests (pure Dart).
  crypto: 3.0.7
  # Native string and memory helpers for the dart:ffi BenchKit backends.
  ffi: 2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  fake_async: 1.3.3
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true
  # Copied from fixtures/v1 by `make fixtures-flutter` (gitignored, byte-identical, verified).
  assets:
    - assets/fixtures/small.json
    - assets/fixtures/representative.json
    - assets/fixtures/stress.json
    - assets/fixtures/small.stream.jsonl
    - assets/fixtures/representative.stream.jsonl
    - assets/fixtures/stress.stream.jsonl
